<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Garden</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 0;
            font-family: 'HeliosExt', Arial, Helvetica, sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        .homepage-section {
            min-height: 100vh;
            position: relative;
        }
        
        .intro-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: transparent;
        }
        
        /* Media boxes section */
        .media-section {
            min-height: 100vh;
            background: #000;
            padding: 80px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .media-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            height: 80vh;
        }
        
        .media-box {
            position: relative;
            background: #111;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .media-box:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .media-box-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
        }
        
        .media-box-content video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000;
        }
        
        .media-box-title {
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 100%;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            font-size: 1.05rem;
            font-weight: 300;
            letter-spacing: 8px;
            color: #fff;
            z-index: 10;
            font-family: 'HeliosExt', Arial, Helvetica, sans-serif;
            transition: background 0.3s ease, font-size 0.3s ease;
        }
        
        .media-box:hover .media-box-title {
            background: rgba(0, 0, 0, 0.5);
            font-size: 1.12rem;
        }
        
        /* Mobile responsive for media section */
        @media screen and (max-width: 768px) {
            .media-section {
                padding: 40px 20px;
            }
            
            .media-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                height: auto;
                min-height: 80vh;
                gap: 20px;
            }
            
            .media-box-title {
                font-size: 0.525rem;
                letter-spacing: 4px;
                bottom: 30%;
            }
            
            .media-box:hover .media-box-title {
                font-size: 0.56rem;
            }
        }
        
        @media screen and (max-width: 480px) {
            .media-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr);
            }
            
            .media-box-title {
                font-size: 0.42rem;
                letter-spacing: 2px;
                bottom: 30%;
            }
        }
        
        .eternal-garden-title {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 40px;
            font-family: 'HeliosExt', Arial, Helvetica, sans-serif;
            color: #fff;
        }
        
        .eternal-garden-subtext {
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.6;
            text-align: center;
            max-width: 800px;
            margin-bottom: 40px;
            letter-spacing: 1px;
            font-family: 'HeliosExt', Arial, Helvetica, sans-serif;
            color: #fff;
        }
        
        .typewriter-cursor {
            animation: blink 1s infinite;
            color: #888;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        /* Make PROJECTS page non-clickable on homepage */
        .hamburger-menu .menu-items ul li a[href="projects.html"] {
            pointer-events: none !important;
            cursor: default !important;
            color: #fff !important;
            text-decoration: none !important;
        }
        
        /* Mobile responsive for homepage */
        @media screen and (max-width: 768px) {
            .eternal-garden-title {
                font-size: 0.8rem !important;
                letter-spacing: 3px;
                margin-bottom: 30px;
            }
            
            .eternal-garden-subtext {
                font-size: 0.4rem !important;
                max-width: 90%;
                line-height: 1.5;
                margin-bottom: 30px;
            }
        }

        @media screen and (max-width: 480px) {
            .eternal-garden-title {
                font-size: 1rem !important;
                letter-spacing: 2px;
                margin-bottom: 25px;
            }
            
            .eternal-garden-subtext {
                font-size: 0.5rem !important;
                max-width: 95%;
                line-height: 1.4;
                margin-bottom: 25px;
            }
            
            .volume-toggle {
                bottom: 15px;
                right: 15px;
                width: 50px;
                height: 50px;
            }
        }

        @media screen and (max-width: 320px) {
            .eternal-garden-title {
                font-size: 1.2rem !important;
                letter-spacing: 1px;
                margin-bottom: 20px;
            }
            
            .eternal-garden-subtext {
                font-size: 0.6rem !important;
                max-width: 98%;
                line-height: 1.3;
                margin-bottom: 20px;
            }
        }
        
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            background-color: #000;
            opacity: 0.6;
        }
        
        .video-container video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(1.1);
        }
        
        .volume-toggle {
            display: none;
        }
        
        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-align: center;
            z-index: 1000;
            font-family: 'HeliosExt', Arial, Helvetica, sans-serif;
        }
        
        /* Ensure hamburger menu is visible */
        .hamburger-menu {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            z-index: 9999 !important;
        }
        
        .hamburger-icon {
            z-index: 10000 !important;
        }
        
        .hamburger-icon span {
            background: #fff !important;
        }
        
        @font-face {
            font-family: 'HeliosExt';
            src: url('fonts/HeliosExt.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>

                    <ul class="sub-menu">

                <li><a href="soundtrack.html">SOUNDTRACK</a></li>

                <li><a href="darkside-soundtrack.html">DARKSIDE SOUNDTRACK</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="oracle.html">ORACLE</a></li>
            </ul>
        </nav>    </div>

    <!-- Homepage Section -->
    <div class="homepage-section">
        <!-- Intro Text Container -->
        <div class="intro-text-container" id="introTextContainer">
            <div class="eternal-garden-title" id="eternalGardenTitle"></div>
            <div class="eternal-garden-subtext" id="eternalGardenSubtext"></div>
        </div>

        <!-- Video Container -->
        <div class="video-container" id="videoContainer">
            <video id="introVideo" loop playsinline webkit-playsinline preload="auto" autoplay muted>
                <source src="./media/videos/gardenerintro.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div id="videoError" class="video-error" style="display: none;">
                Video failed to load. Please refresh the page.
            </div>
            <button id="volumeToggle" class="volume-toggle" aria-label="Toggle sound">
                <span class="volume-icon">🔇</span>
            </button>
        </div>
    </div>

    <!-- Media Boxes Section -->
    <div class="media-section">
        <div class="media-grid">
            <div class="media-box">
                <div class="media-box-content"></div>
                <div class="media-box-title">ZERO</div>
            </div>
            <div class="media-box">
                <div class="media-box-content">
                    <video loop playsinline webkit-playsinline autoplay muted>
                        <source src="./media/videos/dsrunningtrailer.mov" type="video/quicktime">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="media-box-title">DARKSIDE</div>
            </div>
            <div class="media-box">
                <div class="media-box-content"></div>
                <div class="media-box-title">KINDRED</div>
            </div>
            <div class="media-box">
                <div class="media-box-content"></div>
                <div class="media-box-title">REBIRTH</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const introTextContainer = document.getElementById('introTextContainer');
            const videoContainer = document.getElementById('videoContainer');
            const eternalGardenTitle = document.getElementById('eternalGardenTitle');
            const eternalGardenSubtext = document.getElementById('eternalGardenSubtext');
            const video = document.getElementById('introVideo');
            const volumeToggle = document.getElementById('volumeToggle');
            
            // Typewriter effect for title
            const titleText = 'ETERNAL GARDEN';
            let titleIndex = 0;
            
            function typeTitle() {
                if (titleIndex < titleText.length) {
                    eternalGardenTitle.innerHTML = titleText.substring(0, titleIndex + 1) + '<span class="typewriter-cursor">|</span>';
                    titleIndex++;
                    setTimeout(typeTitle, 80);
                } else {
                    eternalGardenTitle.innerHTML = titleText + '<span class="typewriter-cursor">|</span>';
                    // Start typing subtext after title is complete
                    setTimeout(typeSubtext, 300);
                }
            }
            
            // Typewriter effect for subtext
            const subtextText = 'Eternal Garden is a sci-fi fantasy epic about a mystical seed with the power to spawn infinite worlds';
            let subtextIndex = 0;
            
            function typeSubtext() {
                if (subtextIndex < subtextText.length) {
                    eternalGardenSubtext.innerHTML = subtextText.substring(0, subtextIndex + 1) + '<span class="typewriter-cursor">|</span>';
                    subtextIndex++;
                    setTimeout(typeSubtext, 50);
                } else {
                    eternalGardenSubtext.innerHTML = subtextText + '<span class="typewriter-cursor">|</span>';
                }
            }
            
            // Initialize video to play in background, muted and looping
            video.muted = true;
            video.volume = 0;
            video.loop = true;
            
            // Try to play the video immediately
            video.play().catch(error => {
                console.error('Error playing video:', error);
                // If autoplay fails, add click/touch to play functionality
                document.addEventListener('click', function() {
                    video.play().catch(e => console.error('Still cannot play:', e));
                }, { once: true });
                document.addEventListener('touchend', function() {
                    video.play().catch(e => console.error('Still cannot play:', e));
                }, { once: true });
            });
            
            // Start the typewriter sequence
            setTimeout(typeTitle, 500);
        });
    </script>
</body>
</html>
